<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cycle Tracker</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">
  <h1>Cycle Tracker</h1>

  <div class="layout">

<div class="calendar-card">

  <div class="calendar-nav">
    <button id="prevMonth">‹</button>

    <div id="monthLabel"></div>

    <button id="nextMonth">›</button>
  </div>

  <div id="calendar"></div>

  <div class="legend">
    <div><span class="dot red"></span> Menstruation</div>
    <div><span class="dot green"></span> Fertile</div>
  </div>

</div>
    <div class="info-card">
      <h2 id="infoTitle">No day selected</h2>

      <div class="info-content">
        <div class="info-row">
          <span>Temperature</span>
          <span id="infoTemp">-</span>
        </div>

        <div class="info-row">
          <span>Bleeding</span>
          <span id="infoBleeding">-</span>
        </div>

        <div class="info-row">
          <span>Discharge</span>
          <span id="infoDischarge">-</span>
        </div>
      </div>

      <button id="editBtn" class="edit-btn">Edit day</button>
    </div>

  </div>

  <div class="chart-card">
    <canvas id="tempChart"></canvas>

    <div id="chartTable" class="chart-table"></div>
  </div>

<div id="modal" class="modal hidden">
  <div class="modal-card">

    <h2 id="modalTitle"></h2>

    <input id="tempInput" type="number" step="0.01" min="35" max="38" placeholder="36.50">

    <div class="segmented" data-group="bleeding">
      <button data-value="none">None</button>
      <button data-value="spotting">Spotting</button>
      <button data-value="menstruation">Period</button>
    </div>

    <div class="segmented" data-group="discharge">
      <button data-value="none">None</button>
      <button data-value="dry">Dry</button>
      <button data-value="moist">Moist</button>
      <button data-value="wet">Wet</button>
    </div>

    <div class="segmented" data-group="markers">
      <button data-value="peak">Peak</button>
    </div>

    <div class="modal-actions">
      <button id="closeBtn" class="btn secondary">Close</button>
      <button id="saveBtn" class="btn primary">Save</button>
    </div>

  </div>
</div>

<div class="dev-panel">
  <button id="devReset">DEV RESET</button>
</div>

<script src="app.js"></script>

</body>
</html>
