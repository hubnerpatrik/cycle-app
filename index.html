<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Cycle Tracker
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<div class="app">

  <h1>
    Cycle Tracker
  </h1>

  <div class="layout">

    <!-- calendar -->

    <div class="calendar-card">

      <div class="calendar-nav">

        <button
          id="prevMonth"
          type="button"
        >
          ‹
        </button>

        <div id="monthLabel"></div>

        <button
          id="nextMonth"
          type="button"
        >
          ›
        </button>

      </div>

      <div id="calendar"></div>

      <!-- legend -->

      <div class="legend">

        <div>
          <span class="dot red"></span>
          Menstruation
        </div>

        <div>
          <span class="dot green"></span>
          Fertile
        </div>

      </div>

    </div>

    <!-- info panel -->

    <div class="info-card">

      <h2
        class="info-title"
        id="infoTitle"
      >
        No day selected
      </h2>

      <div class="info-panel">

        <!-- temperature -->

        <div class="info-group">

          <div class="info-label">
            Temperature
          </div>

          <div
            class="info-value"
            id="infoTemp"
          >
            -
          </div>

        </div>

        <!-- bleeding -->

        <div class="info-group">

          <div class="info-label">
            Bleeding
          </div>

          <div
            class="info-value"
            id="infoBleeding"
          >
            -
          </div>

        </div>

        <!-- discharge -->

        <div class="info-group">

          <div class="info-label">
            Discharge
          </div>

          <div
            class="info-value"
            id="infoDischarge"
          >
            -
          </div>

        </div>

        <!-- sediment -->

        <div class="info-group">

          <div class="info-label">
            Sediment
          </div>

          <div
            class="info-value"
            id="infoSediment"
          >
            -
          </div>

        </div>

        <!-- other -->

        <div class="info-group">

          <div class="info-label">
            Other
          </div>

          <div
            class="info-value"
            id="infoOther"
          >
            -
          </div>

        </div>

      </div>

      <button
        id="editBtn"
        class="edit-btn"
        type="button"
      >
        Edit day
      </button>

    </div>

  </div>

  <!-- chart -->

  <div class="chart-card">

  <div class="chart-tools">

  <button
    id="horizontalCoverlineBtn"
    class="tool-btn"
    type="button"
  >
    Horizontal coverline
  </button>

  <button
    id="verticalCoverlineBtn"
    class="tool-btn"
    type="button"
  >
    Vertical coverline
  </button>

</div>

    <div class="cycle-map">

      <div class="map-scroll">

        <div class="map-grid">

          <!-- header -->

          <div class="map-header-row">

            <div class="map-side-label"></div>

            <div class="map-temp-spacer"></div>

            <div
              id="dayNumbers"
              class="map-days"
            ></div>

          </div>

          <!-- chart -->

          <div class="map-chart-row">

            <div class="map-side-label">
              Temp (°C)
            </div>

            <div
              id="tempScale"
              class="temp-scale-column"
            ></div>

            <div class="map-chart-area">

              <canvas id="tempChart"></canvas>

            </div>

          </div>

          <!-- cycle day -->

          <div class="map-row">

            <div class="map-side-label">
              CD (days)
            </div>

            <div class="map-temp-spacer"></div>

            <div
              id="cycleDayRow"
              class="map-cells"
            ></div>

          </div>

          <!-- mucus -->

          <div class="map-row">

            <div class="map-side-label">
              Mucus
            </div>

            <div class="map-temp-spacer"></div>

            <div
              id="mucusRow"
              class="map-cells"
            ></div>

          </div>

          <!-- bleeding -->

          <div class="map-row">

            <div class="map-side-label">
              Bleeding
            </div>

            <div class="map-temp-spacer"></div>

            <div
              id="bleedingRow"
              class="map-cells"
            ></div>

          </div>

          <!-- spotting -->

          <div class="map-row">

            <div class="map-side-label">
              Spotting
            </div>

            <div class="map-temp-spacer"></div>

            <div
              id="spottingRow"
              class="map-cells"
            ></div>

          </div>

          <!-- sediment -->

          <div class="map-row">

            <div class="map-side-label">
              Sediment
            </div>

            <div class="map-temp-spacer"></div>

            <div
              id="sedimentRow"
              class="map-cells"
            ></div>

          </div>

          <!-- other -->

          <div class="map-row">

            <div class="map-side-label">
              Other
            </div>

            <div class="map-temp-spacer"></div>

            <div
              id="otherRow"
              class="map-cells"
            ></div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- modal -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-card">

      <!-- modal title -->

      <h2 id="modalTitle">
        Edit day
      </h2>

      <!-- temperature -->

      <div class="modal-section">

        <div class="section-title">
          Temperature
        </div>

        <input
          id="tempInput"
          type="number"
          step="0.01"
          min="35"
          max="38"
          placeholder="36.50"
        >

      </div>

      <!-- fertility -->

      <div class="modal-section">

        <div class="section-title">
          Fertility
        </div>

        <div class="checkbox-group">

          <label class="checkbox-row">

            <input
              type="checkbox"
              id="modalFertile"
            >

            <span>
              Fertile day
            </span>

          </label>

          <label class="checkbox-row">

            <input
              type="checkbox"
              id="modalPeak"
            >

            <span>
              Peak day
            </span>

          </label>

        </div>

      </div>
    <!-- marker -->

    <div class="modal-section">

      <div class="section-title">
        Marker
      </div>

      <select id="modalMarker">

        <option value="">
          None
        </option>

        <option value="1">
          1
        </option>

        <option value="2">
          2
        </option>

        <option value="3">
          3
        </option>

        <option value="4">
          4
        </option>

        <option value="5">
          5
        </option>

        <option value="6">
          6
        </option>

        <option value="P">
          P
        </option>

      </select>
      

    </div>
      <!-- bleeding -->

      <div class="modal-section">

        <div class="section-title">
          Bleeding
        </div>

        <div class="segmented three">

          <button
            type="button"
            data-group="bleeding"
            data-value="none"
          >
            None
          </button>

          <button
            type="button"
            data-group="bleeding"
            data-value="spotting"
          >
            Spotting
          </button>

          <button
            type="button"
            data-group="bleeding"
            data-value="menstruation"
          >
            Period
          </button>

        </div>

      </div>

      <!-- discharge -->

      <div class="modal-section">

        <div class="section-title">
          Discharge
        </div>

        <div class="segmented four">

          <button
            type="button"
            data-group="discharge"
            data-value="none"
          >
            None
          </button>

          <button
            type="button"
            data-group="discharge"
            data-value="dry"
          >
            Dry
          </button>

          <button
            type="button"
            data-group="discharge"
            data-value="moist"
          >
            Moist
          </button>

          <button
            type="button"
            data-group="discharge"
            data-value="wet"
          >
            Wet
          </button>

        </div>

      </div>

      <!-- sediment -->

      <div class="modal-section">

        <div class="section-title">
          Sediment
        </div>

        <div class="segmented two">

          <button
            type="button"
            data-group="sediment"
            data-value="false"
          >
            No sediment
          </button>

          <button
            type="button"
            data-group="sediment"
            data-value="true"
          >
            Sediment
          </button>

        </div>

      </div>

      <!-- other -->

      <div class="modal-section">

        <div class="section-title">
          Other
        </div>

        <input
          id="otherInput"
          type="text"
          placeholder="Other observations"
        >

      </div>

      <!-- actions -->

      <div class="modal-actions">

        <button
          id="closeBtn"
          class="btn secondary"
          type="button"
        >
          Close
        </button>

        <button
          id="saveBtn"
          class="btn primary"
          type="button"
        >
          Save
        </button>

      </div>

    </div>

  </div>

  <!-- dev panel -->

  <div class="dev-panel">

    <button
      id="devReset"
      type="button"
    >
      DEV RESET
    </button>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
